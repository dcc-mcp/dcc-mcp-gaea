[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-gaea"
version = "0.1.0"
description = "Typed Gaea Build Swarm adapter for DCC-MCP"
requires-python = ">=3.7"
dependencies = ["dcc-mcp-core>=0.20.23", "Pillow>=9"]

[project.scripts]
dcc-mcp-gaea = "dcc_mcp_gaea.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_gaea"]

[tool.pytest.ini_options]
pythonpath = ["src"]
